name: CI v2

on:
  push:
    branches: [main]
    paths: [corvus-v2/**, .github/workflows/ci-v2.yaml]
  pull_request:
    paths: [corvus-v2/**, .github/workflows/ci-v2.yaml]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: corvus-v2
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -r requirements.txt
          pip install pytest httpx ruff
      - name: Lint
        run: |
          . .venv/bin/activate
          ruff check corvus/ tests/
      - name: Tests
        run: |
          . .venv/bin/activate
          pytest tests/ -v
