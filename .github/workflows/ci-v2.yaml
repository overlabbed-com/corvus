name: CI v2

# NO paths filter (the adversarial review's high finding): a PR touching only
# corvus-sdk or the Makefile got ZERO CI — the blind spot. The suite is fast:
# every PR and main push runs everything.
# workflow_dispatch stays as the manual re-run lever for any sha.
#
# EVERY component runs its own harness. The live three (v2, sdk, cli) run a real
# build > lint > test cycle; the legacy/config three run their guards. The
# interpreter is pinned to 3.12 here and in the Makefiles — a mismatch changes the
# coverage number and used to hide behind a 7-point tolerance.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  harness:
    name: harness (${{ matrix.component }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component:
          - corvus-v2
          - corvus-sdk
          - corvus-cli
          - corvus-server
          - corvus-hooks
          - corvus-splunk
    defaults:
      run:
        working-directory: ${{ matrix.component }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Setup (pinned venv + deps)
        run: make setup
      - name: Build > Lint > Test
        run: make cycle

  phase-gates:
    # The P1 capability gate, actually gated: BUILD-PLAN.md requires 'the
    # conformance suite runs green in CI with the mutation evidence'. At HEAD
    # neither ran in CI — they were manual targets. They are manual no longer.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: corvus-v2
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Setup
        run: make setup
      - name: Mutation evidence
        run: make mutation
      - name: Conformance run
        run: make conformance

  smoke:
    # Kept from the original gate: the components install and import cleanly.
    # Each component's build step now proves this too, but this job stays as the
    # independent cross-component check that a packaging change cannot silently break.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: The components' smoke (the editable installs + the real imports)
        run: |
          pip install --quiet -e ./corvus-cli -e ./corvus-sdk httpx pyyaml
          python3 - <<'PY'
          import importlib
          failures = []
          for pkg in ("corvus_cli", "corvus_sdk"):
              try:
                  importlib.import_module(pkg)
              except Exception as e:
                  failures.append(f"{pkg}: {type(e).__name__}: {e}")
          if failures:
              print("SMOKE FAILURES:"); [print(" ", f) for f in failures]; __import__("sys").exit(1)
          print("smoke: the components import-clean")
          PY
