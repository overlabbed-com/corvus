name: CI v2

# NO paths filter (the adversarial review's high finding): a PR touching only
# corvus-sdk or the Makefile got ZERO CI — the blind spot. The suite is fast
# (the test ~16s, the smoke ~5s): every PR and main push runs everything.
# workflow_dispatch stays as the manual re-run lever for any sha.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: corvus-v2
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx ruff==0.17.1
      - name: Lint
        run: |
          . .venv/bin/activate
          ruff check corvus/ tests/
      - name: Tests with coverage
        run: |
          . .venv/bin/activate
          pytest tests/ -v --cov=corvus --cov-report=term --cov-report=json:coverage.json --junitxml=junit.xml
      - name: The metrics drift guard
        run: |
          . .venv/bin/activate
          python scripts/gen_metrics.py --coverage coverage.json --junit junit.xml \
            --out /tmp/metrics-check.json --source "$GITHUB_SHA"
          python scripts/check_metrics.py --expected ../docs/canonical-path/dev-metrics.json \
            --actual /tmp/metrics-check.json
      - name: Coverage summary
        run: |
          . .venv/bin/activate
          python -c 'import json; c = json.load(open("coverage.json")); t = c["totals"]; print("coverage: %.1f%% (%d/%d lines)" % (t["percent_covered"], t["covered_lines"], t["num_statements"]))'
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: The components' smoke (the editable installs + the real imports)
        run: |
          pip install --quiet -e ./corvus-cli -e ./corvus-sdk httpx pyyaml
          python3 - <<'PY'
          import importlib
          failures = []
          for pkg in ("corvus_cli", "corvus_sdk"):
              try:
                  importlib.import_module(pkg)
              except Exception as e:
                  failures.append(f"{pkg}: {type(e).__name__}: {e}")
          if failures:
              print("SMOKE FAILURES:"); [print(" ", f) for f in failures]; __import__("sys").exit(1)
          print("smoke: the components import-clean")
          PY
