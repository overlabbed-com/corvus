name: CI v2

# NO paths filter (the adversarial review's high finding): a PR touching only
# corvus-sdk or the Makefile got ZERO CI — the blind spot. The suite is fast
# (the test ~16s, the smoke ~5s): every PR and main push runs everything.
# workflow_dispatch stays as the manual re-run lever for any sha.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: corvus-v2
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx ruff
      - name: Lint
        run: |
          . .venv/bin/activate
          ruff check corvus/ tests/
      - name: Tests with coverage
        run: |
          . .venv/bin/activate
          pytest tests/ -v --cov=corvus --cov-report=term --cov-report=json:coverage.json --junitxml=junit.xml
      - name: The metrics drift guard
        run: |
          . .venv/bin/activate
          python scripts/gen_metrics.py --coverage coverage.json --junit junit.xml \
            --out /tmp/metrics-check.json --source "$GITHUB_SHA"
          python scripts/check_metrics.py --expected ../docs/canonical-path/dev-metrics.json \
            --actual /tmp/metrics-check.json
      - name: Coverage summary
        run: |
          . .venv/bin/activate
          python -c 'import json; c = json.load(open("coverage.json")); t = c["totals"]; print("coverage: %.1f%% (%d/%d lines)" % (t["percent_covered"], t["covered_lines"], t["num_statements"]))'
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: The components' smoke (the import-ability, not just compile)
        run: |
          pip install --quiet httpx pyyaml
          python3 - <<'PY'
          import importlib.util, sys
          from pathlib import Path
          failures = []
          # The import-ability: the modules LOAD (the imports, the deps resolve) —
          # py_compile alone misses the circular imports and the missing deps.
          for f in list(Path('corvus-hooks').rglob('*.py')) + \
                   list(Path('corvus-cli/src').rglob('*.py')) + \
                   list(Path('corvus-sdk/src').rglob('*.py')):
              if '__pycache__' in str(f) or f.name.startswith('test_'):
                  continue
              try:
                spec = importlib.util.spec_from_file_location(f.stem, str(f))
                mod = importlib.util.module_from_spec(spec)
                spec.loader.exec_module(mod)
              except Exception as e:
                # The module-level side effects (the CLI mains) may need args —
                # the ImportError/ModuleNotFoundError classes are the real failures.
                if isinstance(e, (ImportError, ModuleNotFoundError, SyntaxError)):
                  failures.append(f'{f}: {type(e).__name__}: {e}')
          if failures:
              print('SMOKE FAILURES:'); [print(' ', f) for f in failures]; sys.exit(1)
          print('smoke: all components import-clean')
          PY
