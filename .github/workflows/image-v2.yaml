name: Image v2

# The decision-engine image: built on the main push (the paths that matter),
# pushed to ghcr.io/overlabbed-com/corvus-v2 with the sha + latest tags.
# The digest is what the k8s manifest pins (the registry-side pin is the
# durable rollback lever).
on:
  push:
    branches: [main]
    paths: ["corvus-v2/**", "decision-register.yaml", ".github/workflows/image-v2.yaml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to Harbor (the estate's registry-of-record)
        uses: docker/login-action@v3
        with:
          registry: harbor.themillertribe-int.org
          username: ${{ secrets.HARBOR_ROBOT_NAME }}
          password: ${{ secrets.HARBOR_ROBOT_SECRET }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: corvus-v2/Dockerfile
          push: true
          tags: |
            ghcr.io/overlabbed-com/corvus-v2:latest
            ghcr.io/overlabbed-com/corvus-v2:${{ github.sha }}
            harbor.themillertribe-int.org/homelab/corvus-v2:${{ github.sha }}
      - name: The digest record
        run: |
          DIGEST=$(docker buildx imagetools inspect ghcr.io/overlabbed-com/corvus-v2:${{ github.sha }} --format '{{json .Manifest.Digest}}' 2>/dev/null || echo "see-the-push-step")
          echo "image: ghcr.io/overlabbed-com/corvus-v2@${DIGEST}"
          echo "image: harbor.themillertribe-int.org/homelab/corvus-v2:${{ github.sha }}"
