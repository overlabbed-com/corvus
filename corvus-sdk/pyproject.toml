[project]
name = "corvus-sdk"
version = "0.1.0"
requires-python = ">=3.11"
description = "Lightweight Python SDK for the Corvus operational governance API"
# Floors are the versions the harness tested (python3.12), capped at the next
# MAJOR so a breaking release fails at install time rather than silently.
dependencies = ["httpx>=0.28,<1.0"]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "pytest-asyncio>=1.4,<2", "respx>=0.23,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/corvus_sdk"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
