[project]
name = "corvus-cli"
version = "0.1.0"
requires-python = ">=3.11"
description = "CLI for the Corvus operational governance API"
# Floors are the versions the harness tested (python3.12), capped at the next
# MAJOR so a breaking release fails at install time rather than silently.
dependencies = ["httpx>=0.28,<1.0", "typer>=0.27,<1.0", "rich>=15,<16"]

[project.scripts]
corvus = "corvus_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/corvus_cli"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
